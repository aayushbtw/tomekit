name: Deploy to Cloudflare
on:
  push:
    branches: [main]
    # The API reference pages come from the library's build.
    paths:
      - apps/docs/**
      - "!apps/docs/README.md"
      - packages/tomekit/src/**
      - packages/tomekit/package.json
      - packages/tomekit/vite.config.ts
      - pnpm-lock.yaml
      - pnpm-workspace.yaml

concurrency:
  group: void-cloudflare-deploy-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/docs
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1.20.0
        with:
          node-version: 24
          cache: true
          run-install: true
      - run: vp run --filter tomekit build
      - name: Deploy
        env:
          # Add this scoped token at Settings → Secrets and variables → Actions.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Required in fresh checkouts when a Worker Version has no preview URL.
          CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
        run: vp exec void deploy --platform cloudflare
