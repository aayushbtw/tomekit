packages:
  - apps/*
  - packages/*

catalog:
  "@types/node": ^26.5.1
  "@vitest/coverage-v8": 4.1.11
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.3.2
  vite-plus: 0.3.2
  vitest: 4.1.11
  zod: ^4.6.2
allowBuilds:
  esbuild: true
  lightningcss: true
  workerd: true
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
minimumReleaseAgeExclude:
  - "@tanstack/react-start-rsc@0.1.53"
  - "@tanstack/react-start@1.168.54"
  - "@tanstack/start-plugin-core@1.171.44"
