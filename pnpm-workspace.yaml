packages:
  - apps/*
  - packages/*

catalog:
  "@types/node": ^26.6.4
  "@vitest/coverage-v8": 5.0.3
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vite-plus: 1.1.0
  vitest: 5.0.3
  zod: ^4.6.5
allowBuilds:
  better-sqlite3: false
  esbuild: true
  lightningcss: true
  sharp: false
  workerd: true
overrides:
