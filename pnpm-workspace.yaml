  - "@voidzero-dev/vite-plus-linux-arm64-gnu@1.1.0"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@1.1.0"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@1.1.0"
  - "@voidzero-dev/vite-plus-linux-x64-musl@1.1.0"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@1.1.0"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@1.1.0"
  - vite-plus@1.1.0
  - "@tanstack/intent@0.5.5"
  - "@tanstack/react-start-rsc@0.1.63"
  - "@tanstack/react-start-server@1.167.50"
  - "@tanstack/react-start@1.169.2"
  - "@tanstack/router-generator@1.167.44"
  - "@tanstack/router-plugin@1.168.46"
  - "@tanstack/router-utils@1.162.4"
  - "@tanstack/start-plugin-core@1.171.53"
  - "@tanstack/start-server-core@1.169.43"
  - "@tanstack/router-cli@1.167.44"
patchedDependencies:
