packages:
  - apps/*
  - packages/*

catalog:
  "@types/node": ^26.6.4
  "@vitest/coverage-v8": 5.0.1
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vite-plus: 1.1.0
  vitest: 5.0.1
  zod: ^4.6.5
allowBuilds:
  esbuild: true
  lightningcss: true
  sharp: false
  workerd: true
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
minimumReleaseAgeExclude:
  - "@tanstack/react-start-rsc@0.1.53"
  - "@tanstack/react-start@1.168.54"
  - "@tanstack/start-plugin-core@1.171.44"
  - "@cloudflare/vite-plugin@1.62.0"
  - wrangler@4.143.0
  - "@voidzero-dev/vite-plus-core@1.1.0"
  - "@voidzero-dev/vite-plus-darwin-arm64@1.1.0"
  - "@voidzero-dev/vite-plus-darwin-x64@1.1.0"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@1.1.0"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@1.1.0"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@1.1.0"
  - "@voidzero-dev/vite-plus-linux-x64-musl@1.1.0"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@1.1.0"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@1.1.0"
  - vite-plus@1.1.0
  - "@tanstack/intent@0.5.5"
