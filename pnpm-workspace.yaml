packages:
  - apps/*
  - packages/*

catalog:
  "@types/node": ^26.6.4
  "@vitest/coverage-v8": 5.1.0
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
  vite-plus: 1.7.0
  vitest: 5.1.0
  zod: ^4.6.5
allowBuilds:
  better-sqlite3: false
  esbuild: true
  lightningcss: true
  sharp: false
  workerd: true
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vitest
  allowedVersions:
    vitest: "*"
minimumReleaseAgeExclude:
  - "@tanstack/intent@0.5.5"
  - "@tanstack/router-utils@1.162.4"
