packages:
  - apps/*
  - packages/*

catalog:
  "@types/node": ^26.6.4
  "@vitest/coverage-v8": 5.1.0
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
  vite-plus: 1.7.0
  vitest: 5.1.0
  zod: ^4.6.5
allowBuilds:
  better-sqlite3: false
  esbuild: true
  lightningcss: true
  sharp: false
  workerd: true
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vitest
  allowedVersions:
    vitest: "*"
minimumReleaseAgeExclude:
  - "@tanstack/intent@0.5.5"
  - "@tanstack/react-start-rsc@0.1.63"
  - "@tanstack/react-start-server@1.167.50"
  - "@tanstack/react-start@1.169.2"
  - "@tanstack/router-generator@1.167.44"
  - "@tanstack/router-plugin@1.168.46"
  - "@tanstack/router-utils@1.162.4"
  - "@tanstack/start-plugin-core@1.171.53"
  - "@tanstack/start-server-core@1.169.43"
  - "@tanstack/router-cli@1.167.44"
