  "@vitest/coverage-v8": 5.1.0
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
  vite-plus: 1.7.0
  vitest: 5.1.0
  zod: ^4.6.7
allowBuilds:
  better-sqlite3: false
  esbuild: true
  lightningcss: true
  sharp: false
  workerd: true
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
  "@esbuild-kit/core-utils>esbuild": ^0.25.0
  mdx-bundler>uuid: ^11.1.1
  minimatch@>=7 <11.0.1: ^11.0.1
  remark-mdx-frontmatter>toml: ^5.0.1
  sharp@<0.35.5: ^0.35.5
  undici@>=7 <7.30.1: ^7.30.1
  zod@>=4 <4.6.7: ^4.6.7
peerDependencyRules:
  allowAny:
    - vitest
  allowedVersions:
    vitest: "*"
minimumReleaseAgeExclude:
  - "@tanstack/intent@0.5.5"
  - "@tanstack/router-utils@1.162.4"
